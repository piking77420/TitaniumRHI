name: Build and Run

on:
  push:
    branches: [main]

  pull_request:
    branches: [dev]

jobs:
  build:
    name: ${{ matrix.name }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # ============================================================
          # Linux x64 GCC
          # ============================================================

          - name: Linux x64 Vulkan
            os: ubuntu-24.04
            build_type: Release
            configure_args: >-
              -DCMAKE_CXX_COMPILER=g++
              -DTITANIUM_RHI_BACKEND=Vulkan

          # ============================================================
          # Linux ARM64 GCC
          # ============================================================

          - name: Linux ARM64 Vulkan
            os: ubuntu-24.04-arm
            build_type: Release
            configure_args: >-
              -DCMAKE_CXX_COMPILER=g++
              -DTITANIUM_RHI_BACKEND=Vulkan

          # ============================================================
          # Windows x64 MSVC
          # ============================================================

          - name: Windows x64 MSVC DirectX12
            os: windows-2025
            build_type: Release
            configure_args: >-
              -G "Visual Studio 18 2026"
              -A x64
              -DTITANIUM_RHI_BACKEND=DirectX12

          - name: Windows x64 MSVC Vulkan
            os: windows-2025
            build_type: Release
            configure_args: >-
              -G "Visual Studio 18 2026"
              -A x64
              -DTITANIUM_RHI_BACKEND=Vulkan

          # ============================================================
          # Mac OS Metal
          # ============================================================
          - name: macOS ARM64 Clang Default Metal
            os: macos-26
            build_type: Release
            configure_args: >-
              -G "Ninja"
              -DTITANIUM_RHI_BACKEND=Metal

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure
        run: >
          cmake
          -S .
          -B build
          ${{ matrix.configure_args }}

      - name: Build
        run: cmake
          --build build
          --config ${{ matrix.build_type }}

      - name: Run tests
        run: ctest
          --test-dir build
          -C ${{ matrix.build_type }}
          --output-on-failure
          --no-tests=error